name: Frontend

on:
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.*'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.*'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend project
        id: source
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.source.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: steps.source.outputs.exists == 'true'
        run: npm ci

      - name: Build CSS
        if: steps.source.outputs.exists == 'true'
        run: npm run build:css

      - name: Check templates
        if: steps.source.outputs.exists == 'true'
        run: npm run check:templates
